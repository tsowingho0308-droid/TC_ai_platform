version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: combine-ai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: combine_ai
      POSTGRES_PASSWORD: combine_ai_dev
      POSTGRES_DB: combine_ai_platform
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: combine-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
